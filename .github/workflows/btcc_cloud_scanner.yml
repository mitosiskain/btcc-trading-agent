name: BTCC 24/7 Cloud Trading Scanner

on:
  schedule:
    # Runs automatically every 15 minutes 24/7 (stays live for 14 mins polling Telegram every 4s & scanning every 60s)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Continuous live polling duration in minutes (0 = single scan, 14 = standard cycle, 60-350 = extended live session)'
        required: false
        default: '14'
      timeframe:
        description: 'Chart timeframe (4h, 1d, 1w, 1M, 1h)'
        required: false
        default: '4h'
      send_summary:
        description: 'Send full signal sheet to Telegram immediately? (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: btcc-cloud-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Git for Live Cloud State Sync
        run: |
          git config user.name "btcc-cloud-bot"
          git config user.email "btcc-cloud-bot@users.noreply.github.com"

      - name: Run BTCC Cloud Scanner & Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-2.5-flash'
          # Live alpha engine: KRYPTON_V3 (trend breakout, hold-out verified) | CARBON_V2 (previous engine)
          ENGINE_VERSION: 'KRYPTON_V3'
          MARGIN_PER_TRADE_USD: '5.0'
          DEFAULT_LEVERAGE: '5'
          INPUT_DURATION: ${{ github.event.inputs.duration_minutes }}
          INPUT_TIMEFRAME: ${{ github.event.inputs.timeframe }}
          INPUT_SUMMARY: ${{ github.event.inputs.send_summary }}
        run: |
          DUR="${INPUT_DURATION:-14}"
          TF="${INPUT_TIMEFRAME:-4h}"
          SUMMARY_FLAG=""
          if [ "$INPUT_SUMMARY" = "true" ]; then
            SUMMARY_FLAG="--send-summary"
          fi
          python -u cloud_runner.py --timeframe "$TF" --duration-minutes "$DUR" --git-sync $SUMMARY_FLAG

      - name: Persist Open Positions, Alert Cache & Phone Web GUI
        if: always()
        run: |
          git add state/portfolio_state.json state/cloud_alert_cache.json state/carbon_v2_live_model.json docs/index.html docs/state.json btcc/index.html btcc/state.json index.html state.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(state): update cloud portfolio & live phone web GUI [skip ci]"
            git pull --rebase --autostash -X theirs origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push origin HEAD 2>/dev/null || true
          fi
